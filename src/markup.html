<div id="tv-sidebar">
  <header>
    <h1>Tracks</h1>
    <div class="sub" id="tv-counts"></div>
  </header>
  <div class="controls">
    <div class="row">
      <input type="text" id="tv-q" placeholder="Search: place, author, description…">
      <button id="tv-fit" title="Fit everything that passed the filters">⤢</button>
      <button id="tv-fullscreen" title="Full window (Esc to exit)">⛶</button>
    </div>
    <div class="row">
      <label class="lbl">km</label>
      <input type="number" id="tv-dmin" placeholder="from">
      <input type="number" id="tv-dmax" placeholder="to">
      <label class="lbl">year</label>
      <input type="number" id="tv-ymin" placeholder="from">
      <input type="number" id="tv-ymax" placeholder="to">
    </div>
    <div class="row">
      <label class="lbl">color</label>
      <select id="tv-colorBy">
        <option value="side">by side</option>
        <option value="dist">by distance</option>
        <option value="year">by year</option>
        <option value="none">single color</option>
      </select>
      <button id="tv-sidesToggle" title="Filter by side">sides</button>
      <button id="tv-clear">reset</button>
      <button id="tv-viewport">in view</button>
      <label class="lbl" title="Pieces of tracks from the same nakarte links that could not be matched to a row"><input type="checkbox" id="tv-extra"> extra</label>
    </div>
    <div class="chips tv-hidden" id="tv-sideChips"></div>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="routes">Tracks</div>
    <div class="tab" data-tab="orphans">No map</div>
  </div>
  <div id="tv-list"></div>
</div>
<div id="tv-map"></div>
<div id="tv-detail"><span class="close" id="tv-detailClose">×</span><span class="min" id="tv-detailMin" title="Fold">▾</span><div id="tv-detailBody"></div></div>
