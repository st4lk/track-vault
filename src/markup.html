<div id="tv-sidebar">
  <header>
    <h1>Треки</h1>
    <div class="sub" id="tv-counts"></div>
  </header>
  <div class="controls">
    <div class="row">
      <input type="text" id="tv-q" placeholder="Поиск: место, автор, описание…">
      <button id="tv-fit" title="Показать все отфильтрованные">⤢</button>
      <button id="tv-fullscreen" title="На весь экран (Esc — выйти)">⛶</button>
    </div>
    <div class="row">
      <label class="lbl">км</label>
      <input type="number" id="tv-dmin" placeholder="от">
      <input type="number" id="tv-dmax" placeholder="до">
      <label class="lbl">год</label>
      <input type="number" id="tv-ymin" placeholder="от">
      <input type="number" id="tv-ymax" placeholder="до">
    </div>
    <div class="row">
      <label class="lbl">цвет</label>
      <select id="tv-colorBy">
        <option value="side">по стороне света</option>
        <option value="dist">по расстоянию</option>
        <option value="year">по году</option>
        <option value="none">один цвет</option>
      </select>
      <button id="tv-clear">сброс</button>
      <button id="tv-viewport">в видимой области</button>
      <label class="lbl" title="Куски треков из тех же ссылок на nakarte, которые не удалось привязать к строке таблицы"><input type="checkbox" id="tv-extra"> прочее</label>
    </div>
    <div class="chips" id="tv-sideChips"></div>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="routes">Треки</div>
    <div class="tab" data-tab="orphans">Без карты</div>
  </div>
  <div id="tv-list"></div>
</div>
<div id="tv-map"></div>
<div id="tv-detail"><span class="close" id="tv-detailClose">×</span><div id="tv-detailBody"></div></div>
